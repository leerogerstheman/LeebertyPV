  <!-- Zero-dependency, no build step. Load order matters: i18n and UI define the
       primitives that the shell and every view build on.

       The views call window.Views.register(...) as they execute, but the shell
       that owns window.Views (app.js) must load last so that every view file is
       already defined by the time it reads the registry. The stub below resolves
       that ordering: it accepts registrations into a queue, and app.js takes the
       queue over when it loads. Without it every view throws
       "Cannot read properties of undefined (reading 'register')" and the screen
       stays on the boot splash. -->
  <script>
    (function () {
      var pending = [];
      window.Views = {
        pending: pending,
        register: function (name, view) { pending.push([name, view]); },
      };
    })();
  </script>
